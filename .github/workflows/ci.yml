name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  tier1:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome msedge
      - run: npm run test:e2e:tier1
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-tier1
          path: artifacts/
          if-no-files-found: ignore

  tier2:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install firefox webkit
      - run: npm run test:e2e:smoke
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-tier2
          path: artifacts/
          if-no-files-found: ignore
