name: Bug report
description: Report a reproducible rendering, input, occlusion, or lifecycle problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security issues, use private vulnerability reporting instead of this form.
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: three-version
    attributes:
      label: Three.js version
      placeholder: 0.185.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and input device
      description: Include exact stable browser and OS versions. Add mouse, touch, pen, or XR controller when relevant.
      placeholder: Chrome 140, Windows 11, mouse
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - auto / polyfill
        - native (experimental)
        - custom experimental Backend
        - unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a small repository or provide the smallest code that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include console output, screenshots, or a trace when useful. Remove private data.
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: Surface details
      description: Describe the Mesh, material slot, UV transform, DOM size, motion, and possible occluders.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain credentials or private user data.
          required: true
        - label: This is not a security vulnerability.
          required: true
