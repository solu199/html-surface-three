<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="HTML Surface Threeの操作可能なプロトタイプ"
    />
    <title>HTML Surface Lab</title>
  </head>
  <body>
    <main id="app" aria-label="HTML Surface Three demo">
      <canvas id="scene" aria-label="Three.js HTML Surface scene"></canvas>

      <aside id="hud" aria-label="Surface diagnostics">
        <h1>HTML SURFACE<br />LAB</h1>
        <dl>
          <div>
            <dt>Backend</dt>
            <dd id="hud-backend">starting</dd>
          </div>
          <div>
            <dt>Hit</dt>
            <dd id="hud-hit">none</dd>
          </div>
          <div>
            <dt>UV</dt>
            <dd id="hud-uv">—</dd>
          </div>
          <div>
            <dt>DOM</dt>
            <dd id="hud-dom">—</dd>
          </div>
        </dl>
        <p class="hud-help">
          Drag outside a panel to orbit.<br />
          Interact directly on each screen.
        </p>
      </aside>

      <div id="loading" role="status">Preparing HTML surfaces…</div>
      <div id="fallback" hidden></div>
    </main>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
